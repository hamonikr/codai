[package]
name = "codai"
version = "1.2.7"
edition = "2021"
authors = ["HamoniKR <chaeya@gmail.com>"]
description = "AI-powered CLI tool for developers"
license = "Apache-2.0"
repository = "https://github.com/hamonikr/codai"
documentation = "https://github.com/hamonikr/codai"
readme = "README.md"
keywords = ["ai", "cli", "development", "code-generation", "chat"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.2.7"] }
clap = { version = "1.2.7"] }
serde = { version = "1.2.7"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
dirs = "5.0"
colored = "2.1"
spinners = "4.1"
indicatif = "0.17"
regex = "1.10"
lazy_static = "1.4.0"
ureq = { version = "1.2.7"] }
urlencoding = "2.1"
reqwest = { version = "1.2.7"] }
console = "0.15"
dialoguer = "0.11"
async-trait = "0.1.77"
futures = "0.3"
home = "0.5"
log = "0.4"
env_logger = "0.10"
chrono = { version = "1.2.7"] }
crossterm = "0.27"
uuid = { version = "1.2.7"] }
parking_lot = { version = "1.2.7"] }
lock_api = "0.4"
flate2 = "1.0"

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel code generation units to increase optimization
strip = true        # Strip symbols from binary
panic = 'abort'     # Remove panic unwinding to reduce binary size
