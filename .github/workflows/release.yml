name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo apt-get install -y pkg-config libssl-dev
          sudo apt-get install -y crossbuild-essential-arm64
          
      - name: Build for Linux
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu
          
      - name: Upload Linux x86_64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/codai
          retention-days: 3

      - name: Upload Linux ARM64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/codai
          retention-days: 3

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Build for Windows
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          
      - name: Upload Windows Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-windows
          path: target/x86_64-pc-windows-msvc/release/codai.exe
          retention-days: 3

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          
      - name: Build for macOS
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          
      - name: Upload macOS x86_64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-macos-x86_64
          path: target/x86_64-apple-darwin/release/codai
          retention-days: 3

      - name: Upload macOS ARM64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-macos-arm64
          path: target/aarch64-apple-darwin/release/codai
          retention-days: 3

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GH_TOKEN }}
          onlyLastTag: "true"
          stripHeaders: "true"
          stripGeneratorNotice: "true"
          output: CHANGELOG.md
          user: "chaeya"
          project: "codai"

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-linux-x86_64
          path: dist

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-linux-arm64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-windows
          path: dist

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-macos-x86_64
          path: dist

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-macos-arm64
          path: dist

      - name: Rename artifacts
        run: |
          cd dist
          mv codai codai-linux-x86_64
          chmod +x codai-linux-x86_64
          mv codai-linux-arm64 codai-linux-arm64
          chmod +x codai-linux-arm64
          mv codai.exe codai-windows.exe
          mv codai-macos-x86_64 codai-macos-x86_64
          chmod +x codai-macos-x86_64
          mv codai-macos-arm64 codai-macos-arm64
          chmod +x codai-macos-arm64

      - name: Delete existing draft releases
        uses: hugo19941994/delete-draft-releases@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/codai-linux-x86_64
            dist/codai-linux-arm64
            dist/codai-windows.exe
            dist/codai-macos-x86_64
            dist/codai-macos-arm64
            CHANGELOG.md
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

