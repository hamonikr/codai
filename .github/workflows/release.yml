name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,arm-unknown-linux-gnueabihf
          
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
          
      - name: Build for Linux
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu
          cargo build --release --target arm-unknown-linux-gnueabihf
          
      - name: Upload Linux x86_64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: airun-cli-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/airun-cli
          retention-days: 3

      - name: Upload Linux ARM64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: airun-cli-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/airun-cli
          retention-days: 3

      - name: Upload Linux ARM32 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: airun-cli-linux-arm32
          path: target/arm-unknown-linux-gnueabihf/release/airun-cli
          retention-days: 3

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Build for Windows
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          
      - name: Upload Windows Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: airun-cli-windows
          path: target/x86_64-pc-windows-msvc/release/airun-cli.exe
          retention-days: 3

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          
      - name: Build for macOS
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          
      - name: Upload macOS x86_64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: airun-cli-macos-x86_64
          path: target/x86_64-apple-darwin/release/airun-cli
          retention-days: 3

      - name: Upload macOS ARM64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: airun-cli-macos-arm64
          path: target/aarch64-apple-darwin/release/airun-cli
          retention-days: 3

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GH_TOKEN }}
          onlyLastTag: "true"
          stripHeaders: "true"
          stripGeneratorNotice: "true"
          output: CHANGELOG.md
          user: "chaeya"
          project: "airun-cli"

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: airun-cli-linux-x86_64
          path: dist

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: airun-cli-linux-arm64
          path: dist

      - name: Download Linux ARM32 artifact
        uses: actions/download-artifact@v4
        with:
          name: airun-cli-linux-arm32
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: airun-cli-windows
          path: dist

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: airun-cli-macos-x86_64
          path: dist

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: airun-cli-macos-arm64
          path: dist

      - name: Rename artifacts
        run: |
          cd dist
          mv airun-cli airun-cli-linux-x86_64
          chmod +x airun-cli-linux-x86_64
          mv airun-cli-linux-arm64 airun-cli-linux-arm64
          chmod +x airun-cli-linux-arm64
          mv airun-cli-linux-arm32 airun-cli-linux-arm32
          chmod +x airun-cli-linux-arm32
          mv airun-cli.exe airun-cli-windows.exe
          mv airun-cli-macos-x86_64 airun-cli-macos-x86_64
          chmod +x airun-cli-macos-x86_64
          mv airun-cli-macos-arm64 airun-cli-macos-arm64
          chmod +x airun-cli-macos-arm64

      - name: Delete existing draft releases
        uses: hugo19941994/delete-draft-releases@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/airun-cli-linux-x86_64
            dist/airun-cli-linux-arm64
            dist/airun-cli-linux-arm32
            dist/airun-cli-windows.exe
            dist/airun-cli-macos-x86_64
            dist/airun-cli-macos-arm64
            CHANGELOG.md
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} 