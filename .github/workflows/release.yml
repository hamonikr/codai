name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          
      - name: Build for Linux
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          
      - name: Upload Linux x86_64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/codai
          retention-days: 3

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Build for Windows
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          
      - name: Upload Windows Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-windows
          path: target/x86_64-pc-windows-msvc/release/codai.exe
          retention-days: 3

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          
      - name: Build for macOS
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          
      - name: Upload macOS x86_64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-macos-x86_64
          path: target/x86_64-apple-darwin/release/codai
          retention-days: 3

      - name: Upload macOS ARM64 Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: codai-macos-arm64
          path: target/aarch64-apple-darwin/release/codai
          retention-days: 3

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Generate Changelog
      #   uses: janheinrichmerker/action-github-changelog-generator@v2.4
      #   with:
      #     token: ${{ secrets.GH_TOKEN }}
      #     onlyLastTag: "true"
      #     stripHeaders: "true"
      #     stripGeneratorNotice: "true"
      #     output: CHANGELOG.md
      #     user: "chaeya"
      #     project: "codai"

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-linux-x86_64
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-windows
          path: dist/windows

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-macos-x86_64
          path: dist/macos-x86_64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: codai-macos-arm64
          path: dist/macos-arm64

      - name: Prepare release files
        run: |
          mkdir -p dist/release
          # Linux
          if [ -f "dist/linux/codai" ]; then
            cp dist/linux/codai dist/release/codai-linux-x86_64
            chmod +x dist/release/codai-linux-x86_64
          fi
          # Windows
          if [ -f "dist/windows/codai.exe" ]; then
            cp dist/windows/codai.exe dist/release/codai-windows.exe
          fi
          # macOS x86_64
          if [ -f "dist/macos-x86_64/codai" ]; then
            cp dist/macos-x86_64/codai dist/release/codai-macos-x86_64
            chmod +x dist/release/codai-macos-x86_64
          fi
          # macOS ARM64
          if [ -f "dist/macos-arm64/codai" ]; then
            cp dist/macos-arm64/codai dist/release/codai-macos-arm64
            chmod +x dist/release/codai-macos-arm64
          fi
          
          # List files for debugging
          echo "Contents of dist directory:"
          ls -R dist/

      - name: Delete existing draft releases
        uses: hugo19941994/delete-draft-releases@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/release/codai-linux-x86_64
            dist/release/codai-windows.exe
            dist/release/codai-macos-x86_64
            dist/release/codai-macos-arm64
          #   CHANGELOG.md
          # body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

