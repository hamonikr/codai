# Codai Tools 설정 파일
# 이 파일은 자동으로 생성되었습니다.
# 각 설정값을 필요에 맞게 수정해주세요.

# =============================================================================
# SMTP 이메일 설정
# =============================================================================
# Gmail을 사용하는 경우:
# - SMTP_HOST는 'smtp.gmail.com' 사용
# - SMTP_PORT는 587 (TLS) 또는 465 (SSL) 사용
# - SMTP_USERNAME에 Gmail 주소 입력
# - SMTP_PASSWORD에 앱 비밀번호 입력 (Gmail 계정 설정에서 생성 필요)
# - SMTP_SECURE는 TLS 사용시 YES, 미사용시 NO

# Naver 메일을 사용하는 경우:
# SMTP_HOST=smtp.naver.com
# SMTP_PORT=587

# 다음 메일을 사용하는 경우:
# SMTP_HOST=smtp.daum.net
# SMTP_PORT=465

# 현재 설정값:
SMTP_HOST=smtp.worksmobile.com
SMTP_PORT=587
SMTP_USERNAME=
SMTP_PASSWORD=
SMTP_SECURE=YES
